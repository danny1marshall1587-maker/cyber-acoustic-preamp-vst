name: Multi-Platform Plugin Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_NAME: CyberAcousticPreamp

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev \
            libxext-dev libxrender-dev libxrandr-dev libglu1-mesa-dev \
            mesa-common-dev libfreetype6-dev libfontconfig1-dev \
            libcurl4-openssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev \
            libxcb-keysyms1-dev libxcb-xinerama0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-randr0-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"' || '' }}

      - name: Build Plugins
        run: cmake --build build --config Release -j 4

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ runner.os }}
          path: build/${{ env.PROJECT_NAME }}_artefacts/Release/

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download MacOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-macOS
          path: Mac

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-Windows
          path: Win

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-Linux
          path: Linux

      - name: Package Release Archives
        run: |
          zip -r Cyber-Acoustic-Preamp-MacOS.zip Mac/
          zip -r Cyber-Acoustic-Preamp-Windows.zip Win/
          zip -r Cyber-Acoustic-Preamp-Linux.zip Linux/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Cyber-Acoustic-Preamp-MacOS.zip
            Cyber-Acoustic-Preamp-Windows.zip
            Cyber-Acoustic-Preamp-Linux.zip
          name: "Cyber Acoustic Preamp ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            # Cyber Acoustic Preamp ${{ github.ref_name }} — World-Class Modulated Dual-Tank Reverb Release
            
            **Ultimate Fluid Space Acoustic Guitar & Mandolin Pickup Preamp & Cavity Physics**
            *Free and Open Source Standalone Application and VST3 / AU / LV2 Plugin*
            
            ### What's New in v1.6.0:
            - **World-Class Modulated Dual-Tank Acoustic Reverb Engine (Dattorro / Lexicon Topologies)**:
              - Replaced basic FDN tank algorithms with a studio-grade, high-density Figure-of-Eight Dual-Tank Modulated Reverb Engine.
              - **4-Stage Schroeder-Dattorro Input Allpass Diffusion**: Transient-shattering diffusers (228, 172, 610, 445 samples) disperse sharp acoustic pick strikes into dense acoustic wavefronts before tank entry, completely eliminating metallic flutter, twang, and spring-like ringing.
              - **Dual Modulated Cross-Coupled Tanks**: Extended prime delay lines (7120, 5900, 7500, 5100 samples) cross-recirculate in a figure-of-eight topology, delivering ultra-high modal density ($> 10,000\text{ modes/sec}$).
              - **Multi-Speed Hermite Cubic LFO Chorus Modulation**: Dual decorrelated LFOs continuously wander the eigenfrequencies of the tank, creating the signature lush, floating, cloud-like Lexicon 480L / EMT 140 tail with zero pitch clicks.
              - **14-Tap Irrational Spatial Stereo Matrix**: Seven multi-taps extracted across both tanks produce complete left/right channel decorrelation ($r \approx 0$) for an immense, immersive 3D acoustic soundfield.
              - **Three Studio Voicings**:
                - **Studio Room (Type 0)**: Warm, intimate wooden chamber with rapid reflection buildup and natural acoustic wood absorption.
                - **Concert Hall (Type 1)**: Majestic, cathedral-scale acoustic bloom with 24ms pre-delay, slow air absorption damping, and floating chorus tails ($T_{60}$ up to 12s).
                - **Vintage Plate (Type 2)**: Classic EMT 140 steel plate with instant ultra-high diffusion, 180 Hz high-pass conditioning (zero low-end mud), and shimmering 14 kHz metallic highs.
            - **F-Style Mandolin (F-5) Acoustic Cavity Model**:
              - Mathematically modeled for carved spruce soundboard, flamed maple back/sides, twin f-holes, and floating ebony bridge assembly.
              - Coupled Christensen parameters: Helmholtz air resonance $A_0 = 285\text{ Hz}$, soundboard mode $T_1 = 350\text{ Hz}$, shape factor $\sigma = 0.15$.
              - Includes **Preset 10: Bluegrass F-5 Mandolin Chop** (custom proximity, sheen, and body chop tuning).
            - **Level-Matched Master Bypass ("A/B MATCHED BYPASS")**:
              - True loudness-compensated comparison between processed acoustic tone and raw pickup signal ($0.25\times \dots 4.0\times$ short-term RMS tracking), eliminating loudness bias during critical tone evaluation.
            - **Input Gain Staging & RMS Sweet-Spot Meter**:
              - Smooth input gain knob ($-24\text{ dB} \dots +24\text{ dB}$).
              - Live dual-ballistic meter showing RMS bar and Peak needle with clear green target zone (`-24 dBFS` to `-12 dBFS`) indicating optimal converter headroom and fluid non-linearity drive.
            - **Fluid Air & Close-Mic Radiation Engine (`FluidAirMicDSP`)**:
              - **Tri-Point Wavefront Radiation Interference Matrix**: Models the acoustic path interference between the Direct String Wave ($t_0$), Top-Plate Wood Wave ($\Delta t_1 \approx 0.28 - 0.63\text{ ms}$), and Soundhole Helmholtz Piston Wave ($\Delta t_2 \approx 0.85 - 1.60\text{ ms}$). Phase-inverted soundhole subtraction naturally eliminates the boxy $200 - 400\text{ Hz}$ "cardboard box" frequency region that plagues under-saddle pickups.
              - **Free-Air Particle Acceleration Sheen (`micAirSheen`)**: Extracts the 2nd discrete derivative of displacement ($A_{\text{air}}[n] = v[n] - v[n-1]$) with air viscosity damping for uncompressed, velvety $10\text{ kHz}+$ condenser breath that completely bypasses wood fiber damping.
              - **Close-Mic Pressure-Gradient Proximity Effect (`closeMicProximity`)**: Models the natural $90 - 130\text{ Hz}$ chest warmth of a small-diaphragm condenser capsule placed 3 to 6 inches from the 12th fret.
              - **Dual-Stage All-Pass Boundary Acoustic Diffraction**: Simulates 3D acoustic wave wrapping around the curved bout with soft capsule compliance.
              - **Constant-Time Padé Approximant (`FluidMath::fast_tanh`)**: Replaces standard `std::tanh` with a 3-cycle branchless rational approximant ($x(27 + x^2)/(27 + 9x^2)$), guaranteeing zero CPU spikes and zero latency degradation under any signal level.
            - **10-Band Cyber-Denoiser PRO (`AcousticCyberDenoiser`)**:
              - 10-band zero-latency complementary filter bank (60 Hz, 150 Hz, 400 Hz, 800 Hz, 1.5 kHz, 3 kHz, 5 kHz, 8 kHz, 12 kHz) with perfect bit-accurate reconstruction.
              - Spectral subtraction with non-zero floor ($0.08$) ensuring acoustic decay tails sustain naturally into -inf dBFS with zero squelch or gating.
              - Harmonic Shield protecting guitar acoustic fundamentals (150–800 Hz) and Listen Noise diagnostic mode.
            - **Active 3D Tone Matrix (4-Band Studio Acoustic EQ)**:
              - Low Warmth Shelf (110 Hz, ±12 dB).
              - Low-Mid Parametric Boxiness Cut (200–1000 Hz, ±12 dB) to surgically eliminate piezo cardboard honk.
              - High-Mid Parametric String Articulation (1.5–6.5 kHz, ±12 dB) for fingerpicking definition and pick clarity.
              - Air Glass High Shelf (9.5 kHz, ±12 dB) for crystalline sheen and studio gloss.
            - **High-Performance ASIO Support (Windows)**:
              - Native Steinberg ASIO driver backend (`JUCE_ASIO=1`) and WASAPI Exclusive support (`JUCE_WASAPI_EXCLUSIVE=1`) for sub-3ms ultra-low latency.
            - **Dedicated Mono Input Routing**:
              - 1-tap input selector with 5 modes (`Mono In 1`, `Mono In 2`, `Auto-Detect Active`, `Stereo Sum`, `Stereo Discrete`).
            
            ### Included Packages:
            - **Windows x64**: Standalone (.exe with ASIO) + VST3 + LV2
            - **macOS Universal Binary (Apple Silicon M1-M5 + Intel x86_64)**: Standalone (.app) + AU (.component) + VST3 + LV2
            - **Linux x64**: Standalone + VST3 + LV2
            
            ### Features:
            - **Mechanical Soundboard Inertia**: Recreates physical bridge/top-plate mass to eliminate piezo quack.
            - **2-DOF Coupled Fluid Cavity Engine**: Christensen coupled air-body physics for 8 iconic guitar body shapes.
            - **Smart De-Fizz**: 4-stage flexural wave dispersion smear + Linkwitz-Riley dynamic high-frequency clamp.
            - **Auto-Tracking Feedback Killer**: True -inf dB surgical SVF nulls for live stage feedback prevention.
            - **Stereo Acoustic Imager**: Virtual studio condenser mic pair (12th fret vs bridge soundhole).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
